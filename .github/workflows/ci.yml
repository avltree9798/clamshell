name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  cores-linux:
    name: Cores on Linux
    runs-on: ubuntu-24.04
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4
      - run: swift build --target NDSCore --target CTRCore
      - run: swift test
      - run: swift run -c release clamshell-bench

  app-ios:
    name: iOS app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen
      - run: >
          xcodebuild -project Clamshell.xcodeproj -scheme Clamshell
          -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

name: Bisect
on:
  push:
    branches: [ci-bisect]
jobs:
  bisect:
    name: ${{ matrix.flags }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        flags:
          - "-O"
          - "-Ounchecked"
          - "-Ounchecked -wmo"
          - "-Ounchecked -wmo -enforce-exclusivity=unchecked"
          - "-Ounchecked -wmo -enforce-exclusivity=unchecked -Xfrontend -disable-llvm-merge-functions-pass"
          - "-Ounchecked -wmo -enforce-exclusivity=unchecked -cross-module-optimization"
    env:
      CLAMSHELL_FLAGS: ${{ matrix.flags }}
    steps:
      - uses: actions/checkout@v4
      - run: swift build -c release --build-tests 2>&1 | grep -E "error|warning: unsafe|Compiling|Build" | head -60; exit ${PIPESTATUS[0]}
        shell: bash {0}
      - run: swift test -c release --skip-build --verbose 2>&1 | tail -150
        shell: bash {0}
      - run: swift test -c release --skip-build --disable-swift-testing --verbose 2>&1 | tail -80
        shell: bash {0}
      - run: |
          for b in .build/release/*.xctest; do echo "== $b"; done
          ls .build/release | head -50

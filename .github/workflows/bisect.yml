name: Bisect
on:
  push:
    branches: [ci-bisect]
jobs:
  bisect:
    name: ${{ matrix.flags }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        flags:
          - "-O -wmo"
          - "-O -enforce-exclusivity=unchecked"
          - "-O -Xfrontend -disable-llvm-merge-functions-pass"
          - "-O -cross-module-optimization"
          - "-O -wmo -enforce-exclusivity=unchecked -cross-module-optimization"
    env:
      CLAMSHELL_FLAGS: ${{ matrix.flags }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          swift build -c release --build-tests -Xswiftc -enable-testing > build.log 2>&1; status=$?
          grep -E "error|Compiling|Build" build.log | head -60
          exit $status
        shell: bash {0}
      - run: set -o pipefail; swift test -c release --skip-build 2>&1 | tail -15
        shell: bash {0}
      - run: swift test -c release --skip-build --disable-swift-testing --verbose 2>&1 | tail -80
        shell: bash {0}
      - run: |
          for b in .build/release/*.xctest; do echo "== $b"; done
          ls .build/release | head -50
